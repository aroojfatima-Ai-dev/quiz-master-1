<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('Classes', ~{::content})}">
<body>
<th:block th:fragment="content">
  <div class="row between wrap mb16">
    <div><div class="eyebrow">Teaching</div><h1 class="serif page-title">Classes</h1></div>
  </div>
  <div class="grid split">
    <div class="card flush">
      <div class="card-head"><div><h3 class="title">Your classes</h3><p>Each class has a unique join code.</p></div></div>
      <div th:if="${#lists.isEmpty(classes)}" class="empty"><b>No classes yet</b>Create your first class on the right.</div>
      <table class="t" th:unless="${#lists.isEmpty(classes)}">
        <thead><tr><th>Class</th><th>Code</th><th class="r">Students</th><th class="r">Tests</th><th class="r">Created</th></tr></thead>
        <tbody>
          <tr th:each="c : ${classes}">
            <td><a class="rowlink" th:href="@{/teacher/classes/{id}(id=${c.id})}" th:text="${c.name}"></a><div class="sub" th:text="${c.subject}"></div></td>
            <td><span class="roomcode sm num" th:text="${c.code}"></span></td>
            <td class="r num" th:text="${counts[c.id]}"></td>
            <td class="r num" th:text="${testCounts[c.id]}"></td>
            <td class="r faint num" th:text="${@fmt.date(c.createdAt)}"></td>
          </tr>
        </tbody>
      </table>
    </div>
    <aside class="rail">
      <div class="card">
        <div class="card-head"><div><h3 class="title">Create a class</h3><p>A 6-character code is generated for you.</p></div></div>
        <form th:action="@{/teacher/classes}" method="post">
          <div class="field"><label class="f">Class name</label><input class="input" name="name" placeholder="e.g. 9B Chemistry" required></div>
          <div class="field"><label class="f">Subject <span class="faint">(optional)</span></label><input class="input" name="subject" placeholder="Chemistry"></div>
          <button class="btn btn-primary btn-block">Create class</button>
        </form>
      </div>
    </aside>
  </div>
</th:block>
</body></html>
