<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('Results', ~{::content})}">
<body>
<th:block th:fragment="content">
  <div class="mb16"><div class="eyebrow">Teaching</div><h1 class="serif page-title">All submissions</h1></div>
  <div class="card flush">
    <div th:if="${#lists.isEmpty(recent)}" class="empty"><b>Nothing marked yet</b></div>
    <table class="t" th:unless="${#lists.isEmpty(recent)}">
      <thead><tr><th>Student</th><th>Test</th><th>Class</th><th class="r">Score</th><th class="r">%</th><th>Flags</th><th class="r">Submitted</th></tr></thead>
      <tbody><tr th:each="a : ${recent}">
        <td><a class="rowlink" th:href="@{/teacher/attempts/{id}(id=${a.id})}" th:text="${a.student.name}"></a></td>
        <td><a th:href="@{/teacher/tests/{id}/results(id=${a.test.id})}" th:text="${a.test.title}"></a></td>
        <td class="muted" th:text="${a.test.classRoom.name}"></td>
        <td class="r num"><span th:text="${a.score}"></span>/<span th:text="${a.total}"></span></td>
        <td class="r num" th:text="${@fmt.pct(a.percentage)}"></td>
        <td><span th:if="${a.overtime}" class="pill pill-live">Overtime</span> <span th:if="${a.autoSubmitted}" class="pill pill-neutral">Auto</span></td>
        <td class="r faint num" th:text="${@fmt.dateTime(a.submittedAt)}"></td>
      </tr></tbody>
    </table>
  </div>
</th:block>
</body></html>
