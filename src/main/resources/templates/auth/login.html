<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · Rounds</title><link rel="stylesheet" th:href="@{/css/rounds.css}"></head>
<body>
<div class="auth">
  <section class="auth-photo">
    <div>
      <div class="row" style="gap:10px;margin-bottom:28px"><div class="brand-mark"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 12 L8 4 L13 12" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="12" r="1.6" fill="#D98200"/></svg></div><b style="font-size:15px">Rounds</b></div>
      <h1 class="serif">Six characters and you're in.</h1>
      <p>Teachers build the test, students enter the class code, and every round is marked the second it's handed in.</p>
    </div>
  </section>
  <section class="auth-form">
    <div>
      <div class="eyebrow">Welcome back</div>
      <h2 class="serif page-title" style="margin:4px 0 20px">Sign in</h2>
      <div th:if="${notice}" class="flash flash-ok" th:text="${notice}"></div>
      <div th:if="${param.error}" class="flash flash-err">Email or password didn't match. Try again.</div>
      <div th:if="${param.out}" class="flash flash-ok">You've been signed out.</div>
      <form th:action="@{/login}" method="post">
        <div class="field"><label class="f">Email</label><input class="input" name="email" type="email" required autofocus></div>
        <div class="field"><label class="f">Password</label><input class="input" name="password" type="password" required></div>
        <button class="btn btn-primary btn-lg btn-block">Sign in</button>
      </form>
      <div class="hr"></div>
      <p class="muted">New here? <a th:href="@{/register(role='STUDENT')}">Create a student account</a> · <a th:href="@{/register(role='TEACHER')}">Teacher account</a></p>
    </div>
  </section>
</div>
</body></html>
