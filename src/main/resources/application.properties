spring.application.name=quiz-master-1
server.port=${PORT:8080}
server.address=0.0.0.0

# --- Database: MySQL on Railway (set env vars), falls back to H2 locally ---
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/quizmaster;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Initial admin account: created once on first boot if no ADMIN exists ---
app.admin.seed=${APP_ADMIN_SEED:true}
app.admin.email=${APP_ADMIN_EMAIL:admin@quizmaster.app}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@12345}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.thymeleaf.cache=false
server.forward-headers-strategy=framework
